<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
            <title>My Mobile Farm</title>
                <style>
                        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
                                body { background-color: #5b8c32; margin: 0; padding: 12px; text-align: center; color: #222; }
                                        h1 { color: #fff; margin: 5px 0 10px 0; font-size: 24px; text-shadow: 1px 1px 3px rgba(0,0,0,0.4); }
                                                
                                                        /* Top HUD */
                                                                .hud {
                                                                            background: #fff; border-radius: 12px; padding: 10px 15px; margin-bottom: 12px;
                                                                                        display: flex; justify-content: space-around; align-items: center;
                                                                                                    box-shadow: 0 4px 6px rgba(0,0,0,0.15); font-weight: bold; font-size: 15px;
                                                                                                            }
                                                                                                                    .stat { display: flex; align-items: center; gap: 4px; }
                                                                                                                            
                                                                                                                                    /* Grid Layout */
                                                                                                                                            .grid {
                                                                                                                                                        display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;
                                                                                                                                                                    max-width: 360px; margin: 0 auto 15px auto;
                                                                                                                                                                            }
                                                                                                                                                                                    .plot {
                                                                                                                                                                                                aspect-ratio: 1 / 1; background-color: #8d5b4c; border: 3px solid #5c382e;
                                                                                                                                                                                                            border-radius: 12px; display: flex; flex-direction: column; align-items: center;
                                                                                                                                                                                                                        justify-content: center; color: #fff; font-size: 11px; cursor: pointer;
                                                                                                                                                                                                                                    box-shadow: inset 0 0 8px rgba(0,0,0,0.4); text-shadow: 1px 1px 2px #000;
                                                                                                                                                                                                                                            }
                                                                                                                                                                                                                                                    .plot .icon { font-size: 32px; margin-bottom: 2px; }
                                                                                                                                                                                                                                                            .plot.ready { background-color: #4caf50; border-color: #2e7d32; }
                                                                                                                                                                                                                                                                    .plot.locked { background-color: #757575; border-color: #424242; opacity: 0.8; }

                                                                                                                                                                                                                                                                            /* Controls & Silo Tabs */
                                                                                                                                                                                                                                                                                    .panel {
                                                                                                                                                                                                                                                                                                background: #fff; border-radius: 12px; padding: 12px; max-width: 360px;
                                                                                                                                                                                                                                                                                                            margin: 0 auto; box-shadow: 0 4px 6px rgba(0,0,0,0.15); text-align: left;
                                                                                                                                                                                                                                                                                                                    }
                                                                                                                                                                                                                                                                                                                            .panel h3 { margin: 0 0 10px 0; font-size: 16px; color: #333; text-align: center; }
                                                                                                                                                                                                                                                                                                                                    select, button {
                                                                                                                                                                                                                                                                                                                                                width: 100%; padding: 10px; font-size: 14px; border-radius: 8px;
                                                                                                                                                                                                                                                                                                                                                            border: 1px solid #ccc; background: #f8f9fa; font-weight: bold;
                                                                                                                                                                                                                                                                                                                                                                    }
                                                                                                                                                                                                                                                                                                                                                                            button.btn-sell {
                                                                                                                                                                                                                                                                                                                                                                                        background: #28a745; color: white; border: none; margin-top: 6px; cursor: pointer;
                                                                                                                                                                                                                                                                                                                                                                                                }
                                                                                                                                                                                                                                                                                                                                                                                                        button.btn-sell:active { background: #218838; }

                                                                                                                                                                                                                                                                                                                                                                                                                /* Inventory List */
                                                                                                                                                                                                                                                                                                                                                                                                                        .silo-list { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
                                                                                                                                                                                                                                                                                                                                                                                                                                .silo-item {
                                                                                                                                                                                                                                                                                                                                                                                                                                            background: #e9ecef; border-radius: 6px; padding: 6px 10px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                        font-size: 13px; font-weight: bold; display: flex; align-items: center; gap: 4px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </style>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </head>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <body>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <h1>🌾 Swanie Se Plaas</h1>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <!-- Stats HUD -->
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <div class="hud">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <div class="stat">🪙 <span id="coins">100</span></div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <div class="stat">⭐ Lvl <span id="level">1</span></div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <div class="stat">✨ <span id="xp">0</span>/<span id="nextXp">50</span> XP</div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <!-- Farm Grid -->
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <div class="grid" id="farmGrid"></div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <!-- Shop & Controls -->
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <div class="panel">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <h3>🛒 Plant Seed or Animal</h3>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <select id="cropSelect">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <option value="wheat">🌾 Wheat (Cost: 10 | XP: 5 | 10s)</option>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <option value="tomato">🍅 Tomato (Cost: 25 | XP: 12 | 30s)</option>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <option value="corn" disabled id="opt-corn">🌽 Corn (Requires Lvl 2)</option>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <option value="pumpkin" disabled id="opt-pumpkin">🎃 Pumpkin (Requires Lvl 3)</option>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <option value="cow" disabled id="opt-cow">🐄 Cow (Requires Lvl 4)</option>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </select>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <br>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <!-- Storage Silo -->
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <div class="panel">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <h3>🛖 Storage Silo</h3>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <div class="silo-list" id="siloDisplay"></div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <button class="btn-sell" onclick="sellAll()">Sell All Produce 💰</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <script>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        const items = {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    wheat: { name: 'Wheat', cost: 10, value: 10000, time: 5, xp: 100, icon: '🌾', reqLvl: 1 },
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                tomato: { name: 'Tomato', cost: 25, value: 55, time: 5, xp: 25, icon: '🍅', reqLvl: 1 },
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            corn: { name: 'Corn', cost: 50, value: 120, time: 10, xp: 25, icon: '🌽', reqLvl: 2 },
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        pumpkin: { name: 'Pumpkin', cost: 100, value: 260, time: 120, xp: 55, icon: '🎃', reqLvl: 3 },
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    cow: { name: 'Milk', cost: 200, value: 50000, time: 10, xp: 100, icon: '🥛', reqLvl: 4 }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            };

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    const plotCosts = [0, 0, 0, 0, 100, 250, 500, 1000, 2000];

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            let coins = parseInt(localStorage.getItem('f_coins')) || 100;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    let xp = parseInt(localStorage.getItem('f_xp')) || 0;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            let level = parseInt(localStorage.getItem('f_level')) || 1;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    let farmData = JSON.parse(localStorage.getItem('f_data')) || [null, null, null, null, 'locked', 'locked', 'locked', 'locked', 'locked'];
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            let silo = JSON.parse(localStorage.getItem('f_silo')) || {};

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    function saveGame() {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                localStorage.setItem('f_coins', coins);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            localStorage.setItem('f_xp', xp);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        localStorage.setItem('f_level', level);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    localStorage.setItem('f_data', JSON.stringify(farmData));
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                localStorage.setItem('f_silo', JSON.stringify(silo));
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                function getXpForNextLevel(lvl) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            return lvl * 50;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            function addXp(amount) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        xp += amount;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    let needed = getXpForNextLevel(level);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                if (xp >= needed) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                xp -= needed;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                level++;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                alert(`🎉 LEVEL UP! You reached Level ${level}! Check the shop for new items!`);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        updateShopOptions();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        function updateShopOptions() {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    document.getElementById('opt-corn').disabled = level < 2;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                document.getElementById('opt-corn').innerText = level < 2 ? "🌽 Corn (Requires Lvl 2)" : "🌽 Corn (Cost: 50 | XP: 25 | 60s)";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        document.getElementById('opt-pumpkin').disabled = level < 3;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    document.getElementById('opt-pumpkin').innerText = level < 3 ? "🎃 Pumpkin (Requires Lvl 3)" : "🎃 Pumpkin (Cost: 100 | XP: 55 | 2m)";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            document.getElementById('opt-cow').disabled = level < 4;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        document.getElementById('opt-cow').innerText = level < 4 ? "🐄 Cow (Cost: 200 | XP: 100 | 3m)" : "🐄 Cow (Cost: 200 | XP: 100 | 3m)";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        function renderGrid() {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    const gridEl = document.getElementById('farmGrid');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                gridEl.innerHTML = '';

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            farmData.forEach((plot, index) => {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            const div = document.createElement('div');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            div.className = 'plot';

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            if (plot === 'locked') {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                const cost = plotCosts[index];
